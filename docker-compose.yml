
services:
  robosub:
    build: 
      context: .
      dockerfile: Dockerfile
    image: robosub_auv:latest
    container_name: auv_core
    volumes:
      - ./ros2_ws:/workspaces/RoboSub_AUV/ros2_ws
      # Keep colcon build artifacts in a named volume so they persist across
      # container recreation but don't get wiped/rebuilt by image changes
      - colcon_build:/workspaces/RoboSub_AUV/build
      - colcon_install:/workspaces/RoboSub_AUV/install
      - colcon_log:/workspaces/RoboSub_AUV/log
      # X11 socket for GUI apps / Stonefish simulator rendering
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - ROS_DOMAIN_ID=0
    devices:
      - /dev/ttyTHS1:/dev/ttyTHS1
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
    volumes_from: []
    network_mode: host
    stdin_open: true
    tty: true
    command: /bin/bash
    restart: unless-stopped
    privileged: true
    # Uncomment if you need GPU passthrough for Stonefish rendering (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  colcon_build:
  colcon_install:
  colcon_log:

   
